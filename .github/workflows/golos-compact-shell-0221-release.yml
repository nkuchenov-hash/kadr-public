name: GOLOS 0.2.21 Windows — Compact Unified Header and Navigation

on:
  push:
    branches: [main]
    paths: [.github/workflows/golos-compact-shell-0221-release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golos-0-2-21-compact-shell
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: windows-2022
    timeout-minutes: 115
    steps:
      - name: Checkout public distribution website
        uses: actions/checkout@v4
      - name: Checkout verified PRIVATE GOLOS snapshot
        uses: actions/checkout@v4
        with:
          repository: nkuchenov-hash/KADR
          ref: 3c9b51c5b740fb6bcf775330894202f509f53b33
          token: ${{ secrets.KADR_PRIVATE_REPO_TOKEN }}
          path: private-ci
          persist-credentials: false
      - name: Prepare isolated GOLOS-only workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "private-ci/golos-ci-src"
          $target = "$env:RUNNER_TEMP/GOLOS"
          if (-not (Test-Path "$source/src-tauri/Cargo.toml")) { throw 'Private GOLOS snapshot missing' }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path "$source/*" -Destination $target -Recurse -Force
          Copy-Item -Path "$source/.*" -Destination $target -Recurse -Force -ErrorAction SilentlyContinue
          $config = Get-Content "$target/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($config.version -ne '0.2.21') { throw 'GOLOS release version mismatch' }
          if ($config.bundle.windows.nsis.installMode -ne 'both') { throw 'KADR parity installer elevation mode missing' }
          if ($config.bundle.windows.nsis.installerHooks -ne './windows/notes-firewall-hooks.nsh') { throw 'NSIS firewall setup hook missing' }
          $hookFile = "$target/src-tauri/windows/notes-firewall-hooks.nsh"
          if (-not (Test-Path $hookFile)) { throw 'GOLOS firewall hook file missing' }
          foreach ($required in @('8793','8794','GOLOS Notes LAN','GOLOS Notes Discovery','NSIS_HOOK_POSTINSTALL','NSIS_HOOK_PREUNINSTALL')) {
            if (-not (Select-String -Path $hookFile -Pattern $required -SimpleMatch -Quiet)) { throw "Incomplete GOLOS firewall hook: $required" }
          }
          if (-not (Select-String -Path "$target/src-tauri/src/commands.rs" -Pattern "STREAM_FINALIZED_FAST_INSERT" -Quiet)) { throw 'GOLOS 0.2.10 fast-insert fix missing' }
          if (-not (Select-String -Path "$target/src/screens/LogScreen.tsx" -Pattern "followRef" -Quiet)) { throw 'GOLOS 0.2.11 log scroll fix missing' }
          if (-not (Test-Path "$target/src/components/RecordingReader.tsx")) { throw 'Approved recording reader missing' }
          if (-not (Test-Path "$target/src/components/RecordingAudioPlayer.tsx")) { throw 'Real audio waveform player missing' }
          if (-not (Test-Path "$target/src/components/SummaryProgressPanel.tsx")) { throw 'AI summary progress panel missing' }
          if (-not (Select-String -Path "$target/src-tauri/src/call_recorder_summary.rs" -Pattern 'call-recording-summary-progress' -Quiet)) { throw 'Summary progress streaming missing' }
          if (-not (Select-String -Path "$target/src-tauri/src/call_recorder_summary.rs" -Pattern 'resolve_summary_model' -Quiet)) { throw 'Legacy model migration missing' }
          if (-not (Select-String -Path "$target/src/screens/SettingsScreen.tsx" -Pattern 'openai/gpt-oss-20b' -Quiet)) { throw 'Supported Groq model chooser missing' }
          if (-not (Test-Path "$target/src-tauri/src/groq_credentials.rs")) { throw 'Groq Credential Manager integration missing' }
          if (-not (Test-Path "$target/src/components/GroqProviderPanel.tsx")) { throw 'Groq provider setup UI missing' }
          if (-not (Select-String -Path "$target/src-tauri/src/groq_credentials.rs" -Pattern 'probe' -Quiet)) { throw 'Provider inference verification missing' }
          if (-not (Select-String -Path "$target/src-tauri/src/call_recorder_summary.rs" -Pattern 'effective_key' -Quiet)) { throw 'Summary integration missing live credentials' }
          if (-not (Select-String -Path "$target/src-tauri/src/transcribe.rs" -Pattern 'openai/gpt-oss-20b' -Quiet)) { throw 'Supported Groq dictation postprocessing model missing' }

          if (-not (Select-String -Path "$target/src-tauri/src/call_recorder_summary.rs" -Pattern 'SUMMARY_TIMEOUT' -Quiet)) { throw 'Timeout/retry protection missing' }
          if (-not (Select-String -Path "$target/src/components/AudioRecordingCard.tsx" -Pattern 'recording-summary-failure' -Quiet)) { throw 'Actionable failure UI missing' }

          if (-not (Select-String -Path "$target/src-tauri/src/call_recorder_waveform.rs" -Pattern 'track_envelope' -Quiet)) { throw 'Real WAV amplitude analysis missing' }
          if (-not (Select-String -Path "$target/src-tauri/src/mobile_bridge.rs" -Pattern '"origin":"phone"' -Quiet)) { throw 'Phone recording provenance missing' }
          foreach ($check in @(
            @("$target/src/components/AudioRecordingCard.tsx", "recording-action-primary"),
            @("$target/src/screens/CallRecorderScreen.tsx", "recordings-batch-progress"),
            @("$target/src-tauri/src/call_recorder.rs", "update_recording_labels_cmd"),
            @("$target/src/lib/recordingFilters.test.ts", "recordingDisplayOrigin"),
            @("$target/src/screens/CallRecorderScreen.tsx", "recordings-search-control"),
            @("$target/src/screens/CallRecorderScreen.tsx", "recordings-toolbar"),
            @("$target/src/screens/CallRecorderScreen.tsx", "golos-mobile-received"),
            @("$target/src/screens/SettingsScreen.tsx", "MobileBridgePanel"),
            @("$target/src/components/RecordingReader.tsx", "recording-reader-back"),
            @("$target/src/components/WindowControls.tsx", "onMinimize"),
            @("$target/src-tauri/capabilities/default.json", "core:window:allow-minimize"),
            @("$target/src-tauri/src/call_recorder.rs", "ensure_named_recording_files"),
            @("$target/src/styles/globals.css", "--sidebar-w: 128px"),
            @("$target/src/styles/globals.css", "background: transparent;"),
            @("$target/src/styles/globals.css", ".screen-intro"),
            @("$target/src/styles/recordings-workspace.css", ".recordings-page-intro"),
            @("$target/src/screens/shellLayout.test.ts", "uniform compact Windows shell"),
            @("$target/src/styles/globals.css", "screen-scroll-body"),
            @("$target/src/screens/CallRecorderScreen.tsx", "recordings-scroll-body"),
            @("$target/src-tauri/src/call_recorder.rs", "Мои записи"),
            @("$target/src-tauri/src/call_recorder.rs", "hide_internal_recording_folder"),
            @("$target/src-tauri/src/call_recorder.rs", "listing_existing_saved_mobile_recordings_builds_readable_library_automatically"),
            @("$target/src/styles/globals.css", ".screen-header {"),
            @("$target/src/styles/recordings-workspace.css", ".recordings-scroll-body {")
          )) {
            if (-not (Select-String -Path $check[0] -Pattern $check[1] -SimpleMatch -Quiet)) { throw "Recording actions release feature missing: $($check[1])" }
          }
          $buildScript = "$target/src-tauri/build.rs"
          $buildCode = Get-Content $buildScript -Raw
          $anchor = 'let commit = git_commit_label();'
          if (-not $buildCode.Contains($anchor)) { throw 'Build ID override anchor changed' }
          $buildCode = $buildCode.Replace($anchor, 'let commit = std::env::var("GOLOS_SOURCE_SHA_OVERRIDE").unwrap_or_else(|_| git_commit_label());')
          [System.IO.File]::WriteAllText($buildScript, $buildCode)
          "GOLOS_FIXED_SOURCE_SHA=3c9b51c5" >> $env:GITHUB_ENV
          "GOLOS_SOURCE_SHA_OVERRIDE=3c9b51c5" >> $env:GITHUB_ENV
          Write-Host "GOLOS 0.2.21 source snapshot verified; revision 3c9b51c5"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/GOLOS/src-tauri
          cache-on-failure: true
      - name: Generate original GOLOS brand icons
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = "$env:RUNNER_TEMP/golos-icon-tools"
          New-Item -ItemType Directory -Force $tools | Out-Null
          & npm install --prefix $tools --no-audit --no-fund --silent sharp png-to-ico@2.1.8 *> "$env:RUNNER_TEMP/golos-icon-install.log"
          if ($LASTEXITCODE -ne 0) { throw 'Icon dependencies unavailable' }
          $source = "$env:RUNNER_TEMP/GOLOS/src/assets/golos-app-icon.svg"
          $iconDir = "$env:RUNNER_TEMP/GOLOS/src-tauri/icons"
          New-Item -ItemType Directory -Force $iconDir | Out-Null
          $js = @'
          const fs=require('fs');
          const path=require('path');
          const root=process.env.RUNNER_TEMP;
          const sharp=require(path.join(root,'golos-icon-tools/node_modules/sharp'));
          const pngToIco=require(path.join(root,'golos-icon-tools/node_modules/png-to-ico'));
          const src=fs.readFileSync(path.join(root,'GOLOS/src/assets/golos-app-icon.svg'));
          const out=path.join(root,'GOLOS/src-tauri/icons');
          (async()=> {
            const buffers=await Promise.all([16,32,48,64,128,256].map(n=>sharp(src).resize(n,n).png().toBuffer()));
            fs.writeFileSync(path.join(out,'icon.png'),buffers[buffers.length-1]);
            fs.writeFileSync(path.join(out,'icon.ico'),await pngToIco(buffers));
          })().catch(()=>process.exit(1));
          '@
          $script="$tools/generate.cjs"
          [System.IO.File]::WriteAllText($script,$js)
          node $script *> "$env:RUNNER_TEMP/golos-icon-generate.log"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$iconDir/icon.ico")) { throw 'GOLOS brand icon generation failed' }
      - name: Verify frontend and architecture tests
        shell: pwsh
        working-directory: ${{ runner.temp }}/GOLOS
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          npm run test:architecture
          if ($LASTEXITCODE -ne 0) { throw 'Architecture tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Check mobile transfer compatibility source
        shell: pwsh
        run: |
          $bridge = "$env:RUNNER_TEMP/GOLOS/src-tauri/src/mobile_bridge.rs"
          if (-not (Select-String -Path $bridge -Pattern 'consume_upload' -Quiet)) { throw 'Idempotent HTTP upload missing' }
          if (-not (Select-String -Path $bridge -Pattern 'recording_upload_status' -Quiet)) { throw 'Upload preflight missing' }
          if (-not (Select-String -Path $bridge -Pattern 'duplicate_upload_consumes_all_bytes' -Quiet)) { throw 'Duplicate upload regression test missing' }

      - name: Verify Rust on Windows
        shell: pwsh
        working-directory: ${{ runner.temp }}/GOLOS/src-tauri
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust format failed' }
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting check failed' }
          # ort-sys rc12 may receive dangling DLL symlinks from the Windows
          # archive, so its fs::copy fallback crashes with OS error 3.
          $metadata = cargo metadata --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $ort = @($metadata.packages | Where-Object { $_.name -eq 'ort-sys' -and $_.version -eq '2.0.0-rc.12' })
          if ($ort.Count -ne 1) { throw 'ORT package metadata missing' }
          $path = Join-Path (Split-Path $ort[0].manifest_path -Parent) 'build/dynamic_link.rs'
          $code = Get-Content $path -Raw
          $original = 'fs::copy(&lib_path, &out_path).unwrap();'
          $replacement = 'if lib_path.exists() { fs::create_dir_all(out_path.parent().unwrap()).unwrap(); fs::copy(&lib_path, &out_path).unwrap_or_else(|e| panic!("ORT_COPY_FAIL source={} destination={} error={e}", lib_path.display(), out_path.display())); } else { println!("cargo:warning=ORT_DLL_DANGLING_SOURCE {}", lib_path.display()); }'
          if ($code.Contains($original)) {
            [System.IO.File]::WriteAllText($path, $code.Replace($original, $replacement))
            Write-Host 'Applied scoped ort-sys rc12 workaround'
          } else {
            Write-Host 'ORT source does not have the legacy copy statement; preserving upstream implementation'
          }
          foreach ($folder in @('target/release','target/release/deps','target/release/examples')) {
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
          }
          Write-Host 'Applied scoped ORT rc12 clean-runner workaround'
          # Build test binaries before placing runtime DLL dependencies.
          cargo test --release --no-run
          if ($LASTEXITCODE -ne 0) { throw 'Rust test compilation failed' }
          $root = (Resolve-Path 'target/release').Path
          $dllFiles = @(Get-ChildItem (Join-Path $root 'build') -Recurse -File -Filter '*.dll' -ErrorAction SilentlyContinue)
          $dllFiles = @($dllFiles | Where-Object { $_.Name.StartsWith('transcribe') -or $_.Name.StartsWith('ggml') -or $_.Name.StartsWith('onnxruntime') -or $_.Name -eq 'DirectML.dll' })
          if (-not @($dllFiles | Where-Object { $_.Name -eq 'transcribe.dll' }).Count) { throw 'Transcribe runtime library missing after compile' }
          $exeFiles = @(Get-ChildItem $root -Recurse -File -Filter 'golos-*.exe' -ErrorAction SilentlyContinue)
          if ($exeFiles.Count -lt 1) { throw 'No compiled GOLOS test executable' }
          $dirs = @($exeFiles | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique)
          $dirs += (Join-Path $root 'deps')
          $dirs += $root
          foreach ($folder in ($dirs | Sort-Object -Unique)) {
            foreach ($dll in $dllFiles) {
              $dest = Join-Path $folder $dll.Name
              if (-not (Test-Path $dest)) { Copy-Item -LiteralPath $dll.FullName -Destination $dest -Force }
            }
          }
          Write-Host ('Prepared DLLs for test process: ' + (($dllFiles | Select-Object -ExpandProperty Name -Unique) -join ', '))
          cargo test --release
          if ($LASTEXITCODE -ne 0) { throw 'Rust regression tests failed' }
      - name: Build NSIS installer
        shell: pwsh
        working-directory: ${{ runner.temp }}/GOLOS
        run: |
          $ErrorActionPreference = 'Stop'
          npm run tauri build
          if ($LASTEXITCODE -ne 0) { throw 'Windows Tauri installer compilation failed' }
      - name: Verify clean Windows installation of redesigned GOLOS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setups = @(Get-ChildItem "$env:RUNNER_TEMP/GOLOS/src-tauri/target/release/bundle/nsis" -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one installer" }
          $process = Start-Process -FilePath $setups[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exit code $($process.ExitCode)" }
          # Tauri 'both' defaults to a machine-wide install in silent mode.
          # Existing users may choose per-user installation in interactive mode.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'GOLOS/golos.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs/GOLOS/golos.exe'),
            (Join-Path $env:ProgramFiles 'GOLOS/golos.exe'),
            (Join-Path $env:ProgramFiles 'GOLOS/bin/golos.exe')
          )
          if (${env:ProgramFiles(x86)}) {
            $candidates += Join-Path ${env:ProgramFiles(x86)} 'GOLOS/golos.exe'
          }
          $exe = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $exe) {
            $roots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}) |
              Where-Object { $_ -and (Test-Path $_) }
            $found = @($roots | ForEach-Object {
              Get-ChildItem $_ -Directory -Filter '*GOLOS*' -ErrorAction SilentlyContinue |
                Get-ChildItem -Recurse -File -Filter 'golos.exe' -ErrorAction SilentlyContinue
            })
            if ($found.Count -eq 0) { throw 'GOLOS installed executable not found in per-user or per-machine locations' }
            $exe = $found[0].FullName
          }
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          if ($version -notmatch '^0\.2\.20(\.|$)') { throw "Wrong version $version at $exe" }
          $tcpRule = @(Get-NetFirewallRule -DisplayName 'GOLOS Notes LAN' -ErrorAction SilentlyContinue)
          $udpRule = @(Get-NetFirewallRule -DisplayName 'GOLOS Notes Discovery' -ErrorAction SilentlyContinue)
          if ($tcpRule.Count -ne 1 -or $udpRule.Count -ne 1) {
            throw "GOLOS installer did not configure firewall: tcp=$($tcpRule.Count), udp=$($udpRule.Count)"
          }
          $tcpApplication = $tcpRule | Get-NetFirewallApplicationFilter
          if ($tcpApplication.Program -notlike '*golos.exe') {
            throw "TCP firewall rule does not target GOLOS executable: $($tcpApplication.Program)"
          }
          $tcpFilter = $tcpRule | Get-NetFirewallPortFilter
          $udpFilter = $udpRule | Get-NetFirewallPortFilter
          if ($tcpFilter.Protocol -ne 'TCP' -or $tcpFilter.LocalPort -ne '8793') { throw 'GOLOS TCP port rule wrong' }
          if ($udpFilter.Protocol -ne 'UDP' -or $udpFilter.LocalPort -ne '8794') { throw 'GOLOS UDP port rule wrong' }
          $tcpAddress = $tcpRule | Get-NetFirewallAddressFilter
          $udpAddress = $udpRule | Get-NetFirewallAddressFilter
          $tcpRemote = @($tcpAddress.RemoteAddress) -join ','
          $udpRemote = @($udpAddress.RemoteAddress) -join ','
          Write-Host "GOLOS firewall TCP allowed addresses: $tcpRemote"
          Write-Host "GOLOS firewall UDP allowed addresses: $udpRemote"
          foreach ($allowed in @($tcpRemote, $udpRemote)) {
            if (-not $allowed -or $allowed.Trim() -eq 'Any' -or $allowed.Contains('0.0.0.0/0')) {
              throw "GOLOS firewall rule has unrestricted/missing remote addresses: $allowed"
            }
            # The NetSecurity PowerShell module may normalize CIDR to address
            # ranges or netmasks. Require the 10/8 range or LocalSubnet,
            # without comparing formatting literally to '10.0.0.0/8'.
            if ($allowed -notmatch '10[.]0[.]0[.]0|LocalSubnet') {
              throw "GOLOS private LAN addresses not installed: $allowed"
            }
          }
          Write-Host "GOLOS 0.2.21 installed smoke test PASS: $exe; private TCP/UDP firewall rules present"
      - name: Verify and publish installable 0.2.21 and update GOLOS website
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setups = @(Get-ChildItem "$env:RUNNER_TEMP/GOLOS/src-tauri/target/release/bundle/nsis" -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected exactly one installer" }
          $asset = "GOLOS_0.2.21_x64-Compact-Shell.exe"
          Copy-Item $setups[0].FullName $asset -Force
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $asset).Path)
          if ($bytes.Length -lt 5000000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Installer invalid' }
          $hash=(Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii SHA256SUMS.txt
          $notes = @'
          GOLOS 0.2.21 Windows — compact 128px sidebar and identical transparent 88px headings on all screens, retaining 0.2.20's readable recording library.
          - Retains primary Transcribe / Resume / Retry actions directly on recording cards.
          - Puts device/date/view filters, selection and serialized batch transcription in one non-wrapping toolbar.
          - Expands search on demand from a compact button beside New recording, with Escape-to-close.
          - Moves GOLOS Notes pairing to Settings, preserving live phone-to-PC recording refresh.
          - Retains GOLOS 0.2.17 recording classification, editable tags and GOLOS Notes compatibility.
          - Keeps every title fixed outside its scrolling body, eliminating header overlap in all screens.
          - Keeps identical full-width screen content in Settings, Models, Logs, History, Record and Audio recordings.
          - Reduces sidebar to 128px, preserving full visible tab labels with hover titles.
          - All six screens share the same 88px transparent one-line page heading with a 22px title.
          - Removes opaque header bands, the oversized 54px top gap, and distinct page-specific title sizes.
          - Moves the recording hotkey explanation and other page descriptions into scrollable content, keeping the heading concise.
          - Automatically exposes existing phone/PC recordings in a user-facing Мои записи folder, with readable folders and filenames. No manual per-recording conversion is needed; technical sources remain for reliable retransmission.
          - Grants and validates window minimize permission; shows errors if minimize fails.
          - Transcript reader uses an icon-only Back arrow, hiding the duplicate main close cross.
          - Opens a dedicated human-readable recording files folder using named WAV hard links and named TXT/MD files without modifying stable internal paths.
          - Ports KADR's scoped Windows inbound firewall setup: TCP 8793 for audio transfers and UDP 8794 for discovery, limited to private LAN, VPN mesh and local subnet addresses.
          - Tauri NSIS now requests elevation through "both" install mode, allowing in-place per-user install selection and automatic firewall setup on install, and removes rules on uninstall.
          - Windows smoke test checks the actually installed TCP/UDP firewall rules and expected port numbers, not just installer exit code.
          - GOLOS Notes Android 0.1.14 adds KADR connection diagnosis, correct online/offline status and connection management menu.
          - Preserves GOLOS 0.2.15 WAV transfer retry/idempotency, 0.2.14 connected Groq models, full transcripts and audio library.
          - Bluetooth and end-to-end-encrypted relay path from KADR are not yet in GOLOS.
          - Real Android-to-Windows acceptance must be validated on user's devices.
          '@
          $notes | Set-Content release-notes.md -Encoding utf8
          gh release create golos-v0.2.21-compact-shell-rc $asset SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --title "GOLOS 0.2.21 Windows — Compact Unified Header and Navigation" --notes-file release-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          New-Item -ItemType Directory -Force downloads, golos | Out-Null
          Copy-Item $asset downloads/GOLOS-Setup.exe -Force
          "$hash  GOLOS-Setup.exe" | Set-Content -Encoding ascii downloads/GOLOS-Setup.sha256
          $manifest = @{
            name = $asset
            revision = "3c9b51c5"
            sha256 = $hash
            sizeBytes = $bytes.Length
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
            channel = 'preview'
            version = '0.2.21'
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 golos/release.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/GOLOS-Setup.exe downloads/GOLOS-Setup.sha256 golos/release.json
          git commit -m 'Publish verified GOLOS 0.2.21 compact unified header and navigation'
          if ($LASTEXITCODE -ne 0) { throw 'GOLOS website update commit failed' }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw 'GOLOS website rebase failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'GOLOS website push failed' }
          Write-Host "PUBLISHED_GOLOS_0221 https://$($env:GITHUB_REPOSITORY_OWNER).github.io/kadr-public/golos/"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GOLOS-0.2.21-Windows-Compact-Shell
          path: |
            GOLOS_0.2.21_x64-Compact-Shell.exe
            SHA256SUMS.txt
          if-no-files-found: ignore
