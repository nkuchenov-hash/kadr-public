name: Publish GOLOS installer on website

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-golos-download.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: public-golos-installer
  cancel-in-progress: false

jobs:
  publish:
    name: Pin verified GOLOS EXE to website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Resolve latest semantic-version GOLOS installer
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime
          repo = os.environ["PUBLIC_REPO"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases?per_page=100",
              headers={"Accept": "application/vnd.github+json",
                       "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "User-Agent": "GOLOS-public-distribution"}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              releases = json.load(response)
          choices = []
          for release in releases:
              version_match = re.match(r"^golos-v(\d+)\.(\d+)\.(\d+)(?:-|$)", release.get("tag_name", ""), re.I)
              if not version_match:
                  continue
              version = tuple(map(int, version_match.groups()))
              for asset in release.get("assets", []):
                  name = asset.get("name", "")
                  # Modern GOLOS_0.2.x_x64-*.exe and early GOLOS_PR-*_x64-setup.exe.
                  valid_name = re.fullmatch(r"GOLOS_(?:\d+\.\d+\.\d+|PR-\d+_[0-9a-f]{8})_x64(?:-[A-Za-z0-9-]+)?\.exe", name, re.I)
                  if valid_name and asset.get("state") == "uploaded" and asset.get("digest", "").startswith("sha256:"):
                      choices.append((version, asset["created_at"], release, asset))
          if not choices:
              raise SystemExit("No verified GOLOS Windows installer found")
          version, _, release, asset = max(choices, key=lambda item: (item[0], item[1]))
          current_path = __import__("pathlib").Path("golos/release.json")
          if current_path.exists():
              current = json.loads(current_path.read_text(encoding="utf-8-sig"))
              current_version = tuple(map(int, re.match(r"^(\d+)\.(\d+)\.(\d+)$", str(current.get("version", "0.0.0"))).groups()))
              if current_version > version:
                  raise SystemExit(f"REFUSING DOWNGRADE: current {current_version} > selected {version}")
          print(f"Selected {release['tag_name']}/{asset['name']} ({asset['size']} bytes)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={release['tag_name']}\n")
              output.write(f"asset={asset['name']}\n")
              output.write(f"sha256={asset['digest'].removeprefix('sha256:')}\n")
              output.write(f"created={asset['created_at']}\n")
          PY
      - name: Download and verify binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.tag }}
          ASSET: ${{ steps.latest.outputs.asset }}
          EXPECTED: ${{ steps.latest.outputs.sha256 }}
        shell: bash
        run: |
          mkdir -p /tmp/golos-release downloads golos
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir /tmp/golos-release --clobber
          printf '%s  %s\n' "$EXPECTED" "/tmp/golos-release/$ASSET" | sha256sum --check --status
          python3 - <<'PY'
          import os, pathlib
          file = pathlib.Path("/tmp/golos-release") / os.environ["ASSET"]
          if file.stat().st_size < 1_000_000 or file.open("rb").read(2) != b"MZ":
              raise SystemExit("Unexpected Windows installer payload")
          print("Verified PE installer:", file.stat().st_size, "bytes")
          PY
          cp "/tmp/golos-release/$ASSET" downloads/GOLOS-Setup.exe
          printf '%s  GOLOS-Setup.exe\n' "$EXPECTED" > downloads/GOLOS-Setup.sha256
      - name: Publish website release metadata
        env:
          ASSET: ${{ steps.latest.outputs.asset }}
          TAG: ${{ steps.latest.outputs.tag }}
          EXPECTED: ${{ steps.latest.outputs.sha256 }}
          CREATED: ${{ steps.latest.outputs.created }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          early_sha = re.search(r"PR-\d+_([0-9a-f]{8})", os.environ["ASSET"], re.I)
          tag_version = re.search(r"^golos-v(\d+\.\d+\.\d+)(?:-|$)", os.environ["TAG"], re.I)
          if not tag_version:
              raise SystemExit("Unable to derive GOLOS version from release tag")
          previous = json.loads(pathlib.Path("golos/release.json").read_text(encoding="utf-8-sig")) if pathlib.Path("golos/release.json").exists() else {}
          revision = previous.get("revision") if previous.get("version") == tag_version.group(1) and previous.get("sha256") == os.environ["EXPECTED"] else (early_sha.group(1) if early_sha else "preview")
          metadata = {
            "name": os.environ["ASSET"],
            "revision": revision,
            "sha256": os.environ["EXPECTED"],
            "sizeBytes": pathlib.Path("downloads/GOLOS-Setup.exe").stat().st_size,
            "publishedAt": os.environ["CREATED"],
            "channel": "preview",
            "version": tag_version.group(1),
          }
          pathlib.Path("golos/release.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY
      - name: Commit checked installer to public website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/GOLOS-Setup.exe downloads/GOLOS-Setup.sha256 golos/release.json
          if git diff --cached --quiet; then
            echo "GOLOS installer already up to date"
            exit 0
          fi
          git commit -m "Publish verified GOLOS Windows preview on site"
          git fetch origin main
          # New release wins if a concurrent site deployment touched release.json.
          git rebase -X theirs origin/main
          git push origin HEAD:main
