name: Build and publish Android

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout KADR source
        uses: actions/checkout@v4
        with:
          repository: nkuchenov-hash/KADR
          ref: main
          path: source
          token: ${{ secrets.KADR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Check if KADR changed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          source_sha=$(git -C source rev-parse HEAD)

          previous_sha="$(
            gh release view android-latest \
              --repo "$GITHUB_REPOSITORY" \
              --json body \
              -q '.body' 2>/dev/null \
            | grep -Eo '[0-9a-f]{40}' \
            | tail -n 1 || true
          )"

          echo "Current KADR: $source_sha"
          echo "Published KADR: $previous_sha"

          if [ "$source_sha" = "$previous_sha" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No changes. Nothing to build."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "New KADR version found. Building APK."
          fi

      - name: Set up Java 17
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.changes.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: steps.changes.outputs.build == 'true'
        env:
          KADR_ANDROID_SIGNING_PASSWORD: ${{ secrets.KADR_ANDROID_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KADR_ANDROID_SIGNING_PASSWORD"

          mkdir -p source/mobile/android/KADR/signing

          base64 -d \
            source/mobile/android/signing/kadr-preview.keystore.b64 \
            > source/mobile/android/KADR/signing/kadr-preview.jks

          {
            echo 'storeFile=../KADR/signing/kadr-preview.jks'
            printf 'storePassword=%s\n' "$KADR_ANDROID_SIGNING_PASSWORD"
            echo 'keyAlias=kadr'
            printf 'keyPassword=%s\n' "$KADR_ANDROID_SIGNING_PASSWORD"
          } > source/mobile/android/KADR/signing/key.properties

      - name: Test and build signed Android release
        if: steps.changes.outputs.build == 'true'
        working-directory: source/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Prepare release
        if: steps.changes.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          apk='source/mobile/android/app/build/outputs/apk/release/app-release.apk'

          test -f "$apk"
          jarsigner -verify "$apk" >/dev/null

          mkdir -p release

          cp "$apk" release/KADR-Mobile.apk
          sha256sum release/KADR-Mobile.apk > release/KADR-Mobile.sha256

          source_sha=$(git -C source rev-parse HEAD)

          cat > release/notes.md <<EOF
          EN

          # Latest KADR Companion Android build

          Automatically built from the latest KADR source.

          Source commit: ${source_sha}

          RU

          # Последняя версия KADR Companion для Android

          Автоматически собрана из актуальной версии KADR.

          Исходный commit: ${source_sha}
          EOF

      - name: Publish Android release
        if: steps.changes.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          tag='android-latest'

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$repo" \
              --title 'KADR Companion — Android Preview' \
              --notes-file release/notes.md \
              --prerelease

            gh release upload "$tag" \
              --repo "$repo" \
              release/KADR-Mobile.apk \
              release/KADR-Mobile.sha256 \
              --clobber
          else
            gh release create "$tag" \
              --repo "$repo" \
              release/KADR-Mobile.apk \
              release/KADR-Mobile.sha256 \
              --title 'KADR Companion — Android Preview' \
              --notes-file release/notes.md \
              --prerelease
          fi

      - name: Retain signed APK artifact
        if: steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KADR-Mobile-signed
          path: |
            release/KADR-Mobile.apk
            release/KADR-Mobile.sha256
          if-no-files-found: error
