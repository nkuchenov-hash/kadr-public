name: Build and publish Android 1.0.13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-unsigned.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout KADR source
        uses: actions/checkout@v4
        with:
          repository: nkuchenov-hash/KADR
          ref: main
          path: source
          token: ${{ secrets.KADR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KADR_ANDROID_SIGNING_PASSWORD: ${{ secrets.KADR_ANDROID_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KADR_ANDROID_SIGNING_PASSWORD"
          mkdir -p source/mobile/android/KADR/signing
          base64 -d source/mobile/android/signing/kadr-preview.keystore.b64 > source/mobile/android/KADR/signing/kadr-preview.jks
          {
            echo 'storeFile=../KADR/signing/kadr-preview.jks'
            printf 'storePassword=%s\n' "$KADR_ANDROID_SIGNING_PASSWORD"
            echo 'keyAlias=kadr'
            printf 'keyPassword=%s\n' "$KADR_ANDROID_SIGNING_PASSWORD"
          } > source/mobile/android/KADR/signing/key.properties

      - name: Test and build signed Android release
        working-directory: source/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail
          apk='source/mobile/android/app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"
          jarsigner -verify "$apk" >/dev/null
          mkdir -p release
          cp "$apk" release/KADR-Mobile.apk
          sha256sum release/KADR-Mobile.apk > release/KADR-Mobile.sha256
          source_sha=$(git -C source rev-parse HEAD)
          cat > release/notes.md <<EOF
          EN

          # LAN pairing now stays on Wi-Fi

          KADR Companion 1.0.13 forces local desktop traffic onto the physical Wi-Fi network instead of allowing Android to route it through cellular or VPN interfaces.

          Pairing also adds a Wi-Fi-first discovery and subnet recovery path, while the Windows app now retries its mobile receiver automatically if it is not ready.

          Source commit: ${source_sha}

          RU

          # Подключение по локальной сети теперь идёт через Wi-Fi

          KADR Companion 1.0.13 принудительно отправляет локальный трафик к компьютеру через физическую Wi-Fi сеть, а не через мобильную сеть или VPN Android.

          Также добавлен отдельный Wi-Fi-first поиск компьютера и восстановление по локальной подсети, а Windows-приложение автоматически перезапускает мобильный приёмник, если тот оказался не готов.

          Исходный commit: ${source_sha}
          EOF

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag='android-latest'
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$repo" --title 'KADR Companion — Android Preview' --notes-file release/notes.md --prerelease
            gh release upload "$tag" --repo "$repo" release/KADR-Mobile.apk release/KADR-Mobile.sha256 --clobber
          else
            gh release create "$tag" --repo "$repo" release/KADR-Mobile.apk release/KADR-Mobile.sha256 --title 'KADR Companion — Android Preview' --notes-file release/notes.md --prerelease
          fi

      - name: Retain signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KADR-Mobile-1.0.13-signed
          path: |
            release/KADR-Mobile.apk
            release/KADR-Mobile.sha256
          if-no-files-found: error