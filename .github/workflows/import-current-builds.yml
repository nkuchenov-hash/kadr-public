name: Import current KADR builds

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-current-builds.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download current Windows and Android builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl -fL 'https://release-assets.githubusercontent.com/github-production-release-asset/1299827051/583e3daa-951a-4d63-9d83-e304a7e1e21a?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-25T14%3A29%3A10Z&rscd=attachment%3B+filename%3DKADR-Setup.exe&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-25T13%3A28%3A53Z&ske=2026-09-25T14%3A29%3A10Z&sks=b&skv=2018-11-09&sig=jORkUBwB5NFWH49nfc9Gi1%2Fzeqbdkzr20zke3CTy26M%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MDM0NTI1NCwibmJmIjoxNzkwMzQzNDU0LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.avaDn69SLpviHxkrpHAjgJlIpfStdh9ta6lX52aY-tA&response-content-disposition=attachment%3B%20filename%3DKADR-Setup.exe&response-content-type=application%2Foctet-stream' -o downloads/KADR-Setup.exe
          curl -fL 'https://release-assets.githubusercontent.com/github-production-release-asset/1299827051/c0cada13-e474-4789-9427-a2cfb5def80a?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-25T14%3A10%3A51Z&rscd=attachment%3B+filename%3DKADR-Mobile.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-25T13%3A09%3A56Z&ske=2026-09-25T14%3A10%3A51Z&sks=b&skv=2018-11-09&sig=GSy0MUWZq%2F%2FT2rQqqxITvqvBsrgReIVR1vZ0B6jmEKw%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MDM0Mzc1NCwibmJmIjoxNzkwMzQzNDU0LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.E8aBdkkWI2SCvC8jdAKzdUoKWsoNG4fE6-oMQxBuYtU&response-content-disposition=attachment%3B%20filename%3DKADR-Mobile.apk&response-content-type=application%2Fvnd.android.package-archive' -o downloads/KADR-Mobile.apk
          echo '735152ffebba52df34c0bca839a1121f316ddeb7ddc19cb46889461e9a884250  downloads/KADR-Setup.exe' | sha256sum -c -
          echo 'a6b71ed8c5df231d520aaed106c997264cb959a5659f50bfafdf7f4e0467b176  downloads/KADR-Mobile.apk' | sha256sum -c -
          sha256sum downloads/KADR-Setup.exe > downloads/KADR-Setup.sha256
          sha256sum downloads/KADR-Mobile.apk > downloads/KADR-Mobile.sha256

      - name: Commit current downloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/KADR-Setup.exe downloads/KADR-Setup.sha256 downloads/KADR-Mobile.apk downloads/KADR-Mobile.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'release: update Windows and Android downloads'
            git push origin HEAD:main
          fi

      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag='windows-latest'
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$repo" --title 'KADR for Windows' --notes 'Current public Windows build.' --latest
            gh release upload "$tag" --repo "$repo" downloads/KADR-Setup.exe downloads/KADR-Setup.sha256 --clobber
          else
            gh release create "$tag" --repo "$repo" downloads/KADR-Setup.exe downloads/KADR-Setup.sha256 --title 'KADR for Windows' --notes 'Current public Windows build.' --latest
          fi

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag='android-latest'
          cp downloads/KADR-Mobile.apk downloads/kadr-companion.apk
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$repo" --title 'KADR Companion — Android' --notes 'Current signed Android Companion build.' --prerelease
            gh release upload "$tag" --repo "$repo" downloads/KADR-Mobile.apk downloads/kadr-companion.apk downloads/KADR-Mobile.sha256 --clobber
          else
            gh release create "$tag" --repo "$repo" downloads/KADR-Mobile.apk downloads/kadr-companion.apk downloads/KADR-Mobile.sha256 --title 'KADR Companion — Android' --notes 'Current signed Android Companion build.' --prerelease
          fi
