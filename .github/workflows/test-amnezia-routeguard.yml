name: Test Amnezia LAN Route Guard

on:
  push:
    paths:
      - 'tools/KADR-Amnezia-RouteGuard.ps1'
      - 'tools/Test-KADR-Amnezia-RouteGuard.ps1'
      - 'tools/INSTALL-RouteGuard.cmd'
      - 'tools/UNINSTALL-RouteGuard.cmd'
      - 'tools/README-RouteGuard-RU.txt'
      - '.github/workflows/test-amnezia-routeguard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate own-IP-only route repair without changing host routes
        shell: powershell
        run: .\tools\Test-KADR-Amnezia-RouteGuard.ps1
      - name: Install, start and uninstall scheduled recovery task
        shell: powershell
        run: |
          $guard = Join-Path $PWD 'tools\KADR-Amnezia-RouteGuard.ps1'
          $exe = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          try {
            & $exe -NoProfile -ExecutionPolicy Bypass -File $guard -Install
            if ($LASTEXITCODE -ne 0) { throw "Route guard task install failed: $LASTEXITCODE" }
            Start-Sleep -Seconds 2
            $task = Get-ScheduledTask -TaskName 'KADR Amnezia LAN Route Guard'
            if ($null -eq $task -or $task.State -ne 'Running') {
              throw "Route guard did not enter Running state: $($task.State)"
            }
            if (-not (Test-Path "$env:ProgramFiles\KADR Route Guard\KADR-Amnezia-RouteGuard.ps1")) {
              throw 'Protected route guard script was not installed'
            }
          } finally {
            & $exe -NoProfile -ExecutionPolicy Bypass -File $guard -Uninstall
            if ($LASTEXITCODE -ne 0) { throw "Route guard uninstall failed: $LASTEXITCODE" }
          }
          if (Get-ScheduledTask -TaskName 'KADR Amnezia LAN Route Guard' -ErrorAction SilentlyContinue) {
            throw 'Scheduled task remained after uninstall'
          }

      - name: Publish tested route guard package
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -Path dist -ItemType Directory -Force | Out-Null
          $zip = Join-Path $PWD 'dist\KADR-Amnezia-RouteGuard.zip'
          Compress-Archive -Path @(
            'tools\KADR-Amnezia-RouteGuard.ps1',
            'tools\INSTALL-RouteGuard.cmd',
            'tools\UNINSTALL-RouteGuard.cmd',
            'tools\README-RouteGuard-RU.txt'
          ) -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw 'Package is missing' }
          $tag = 'amnezia-routeguard-latest'
          $existingTags = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json | Select-Object -ExpandProperty tagName)
          if ($LASTEXITCODE -ne 0) { throw 'Could not check release tags' }
          if ($existingTags -notcontains $tag) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title 'KADR Amnezia LAN Route Guard' --notes 'Opt-in LAN self-route repair for AmneziaVPN on Windows. Does not disable VPN or KillSwitch; cannot bypass a blocking KillSwitch. Requires one-time administrator installation.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY $zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish package' }
