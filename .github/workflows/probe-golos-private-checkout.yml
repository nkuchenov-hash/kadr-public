name: Verify GOLOS private checkout for public distribution
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-golos-private-checkout.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - name: Check existing private-repo token availability
        shell: pwsh
        env:
          PRIVATE_TOKEN: ${{ secrets.KADR_PRIVATE_REPO_TOKEN }}
        run: |
          if (-not $env:PRIVATE_TOKEN) { throw 'No private checkout token configured' }
          Write-Host 'Private checkout token exists (value not printed)'
      - name: Checkout GOLOS pinned revision privately
        uses: actions/checkout@v4
        with:
          repository: nkuchenov-hash/GOLOS
          ref: 8bef693471be24c4bcf49cb2f800f7f71338b863
          token: ${{ secrets.KADR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: source
      - name: Confirm revision only; do not publish source
        shell: pwsh
        run: |
          $sha = (git -C source rev-parse HEAD).Trim()
          if ($sha -ne '8bef693471be24c4bcf49cb2f800f7f71338b863') { throw 'Wrong source revision' }
          Write-Host 'GOLOS_PRIVATE_CHECKOUT_AUTHORIZED true'
