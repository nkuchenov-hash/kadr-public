name: Verify and publish KADR Android 1.0.21 UX fixes
on:
  push:
    paths: ['.github/workflows/build-kadr-android-1_0_21-fixes.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kadr-android-1-0-21-fixes
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KADR_SHA: 7c44e2484c3d6665ee6d34d514e4a08ead8f0839
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact private KADR source revision
        uses: actions/checkout@v4
        with:
          repository: nkuchenov-hash/KADR
          ref: 7c44e2484c3d6665ee6d34d514e4a08ead8f0839
          token: ${{ secrets.KADR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: source
      - name: Validate source revision
        run: test "$(git -C source rev-parse HEAD)" = "$KADR_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: source
        run: flutter pub get
      - name: Android regression tests and Java compilation
        working-directory: source/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Restore signing key
        shell: bash
        env:
          KADR_ANDROID_SIGNING_PASSWORD: ${{ secrets.KADR_ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KADR_ANDROID_SIGNING_PASSWORD"
          mkdir -p source/mobile/android/KADR/signing
          base64 -d source/mobile/android/signing/kadr-preview.keystore.b64 > source/mobile/android/KADR/signing/kadr-preview.jks
          {
            echo 'storeFile=../KADR/signing/kadr-preview.jks'
            printf 'storePassword=%s\n' "$KADR_ANDROID_SIGNING_PASSWORD"
            echo 'keyAlias=kadr'
            printf 'keyPassword=%s\n' "$KADR_ANDROID_SIGNING_PASSWORD"
          } > source/mobile/android/KADR/signing/key.properties
      - name: Build signed Android APK
        working-directory: source/mobile/android
        run: |
          ./gradlew --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/apk/release/app-release.apk >/dev/null
      - name: Publish dedicated verified Android update
        shell: bash
        run: |
          set -euo pipefail
          cp source/mobile/android/app/build/outputs/apk/release/app-release.apk KADR-Mobile-1.0.21-UX-Fixes.apk
          sha256sum KADR-Mobile-1.0.21-UX-Fixes.apk > KADR-Mobile-1.0.21.sha256
          cat > /tmp/release-notes.md <<'EOF'
          # KADR Companion 1.0.21 — connectivity and gallery improvements

          - Diagnostics no longer force the app to navigate away.
          - Pairing does not masquerade as a proven live transfer connection.
          - Full-width reconnect and disconnect buttons.
          - Full screenshot library indexing, lazy-rendered large 2-column edge-to-edge tiles.
          - Date selection and grouped dates; separate camera photo gallery.
          - On-device image metadata analysis and opt-in OCR of possible meter reading photos.
          - Upward paper-like send animation in preview and for selected gallery tiles.
          - No duplicate in-app delete warning; Android's legally required MediaStore confirmation is preserved.
          - Direct cloud pairing fallback retained.
          - Previous KADR Windows automatic cloud preview remains compatible.

          Source commit: 7c44e2484c3d6665ee6d34d514e4a08ead8f0839.
          Automated Android tests and signed release build verified in this run.
          Physical phone transfer and photo OCR accuracy require validation on actual devices.
          EOF
          gh release create kadr-mobile-1.0.21-ux KADR-Mobile-1.0.21-UX-Fixes.apk KADR-Mobile-1.0.21.sha256 --repo "$GITHUB_REPOSITORY" --title "KADR Mobile 1.0.21 - Gallery and Connectivity Fixes" --notes-file /tmp/release-notes.md --prerelease
      - name: Verify APK release asset
        shell: bash
        run: |
          set -euo pipefail
          gh release view kadr-mobile-1.0.21-ux --repo "$GITHUB_REPOSITORY" --json assets > /tmp/kadr-apk.json
          node -e "if(!require('/tmp/kadr-apk.json').assets.some(a=>a.name==='KADR-Mobile-1.0.21-UX-Fixes.apk' && a.size>1000000))process.exit(1)"
          echo KADR_1_0_21_PUBLISHED
