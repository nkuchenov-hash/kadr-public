name: Build KADR Longshot Test APK

on:
  push:
    branches:
      - test/android-longshot-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android-longshot-test
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp android-longshot-test/app/build/outputs/apk/debug/app-debug.apk KADR-Longshot-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KADR-Longshot-Test
          path: KADR-Longshot-Test.apk
          if-no-files-found: error
