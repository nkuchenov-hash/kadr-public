name: GOLOS 0.2.5 private source checkout probe
on:
  push:
    paths:
      - .github/workflows/golos-025-private-access-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout private GOLOS source without printing contents
        uses: actions/checkout@v4
        with:
          repository: nkuchenov-hash/GOLOS
          ref: d2235980226da9b266b9b740200f05497fb59483
          token: ${{ secrets.KADR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: source
      - name: Confirm source and version only
        shell: bash
        run: |
          test -f source/src-tauri/Cargo.toml
          test -f source/src-tauri/tauri.conf.json
          python3 -c 'import json; assert json.load(open("source/src-tauri/tauri.conf.json"))["version"] == "0.2.5"'
          echo "GOLOS_025_PRIVATE_CHECKOUT_OK"
