name: Build and release signed KADR Mobile 1.0.31
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-kadr-mobile-131.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kadr-mobile-131-signed
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SOURCE_SHA: 8eefb43aee6648055bceb2962f893f7854627f38
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout private KADR Android sources
        uses: actions/checkout@v4
        with:
          repository: nkuchenov-hash/KADR
          ref: 8eefb43aee6648055bceb2962f893f7854627f38
          token: ${{ secrets.KADR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: source
      - name: Verify exact private source revision and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          grep -q "versionCode 41" source/mobile/android/app/build.gradle
          grep -q "versionName '1.0.31'" source/mobile/android/app/build.gradle
          test "$(cat source/mobile/android/RELEASE_VERSION)" = "1.0.31"
          test -f source/mobile/android/app/src/main/java/com/kadr/mobile/KadrThemedActivity.java
          test -f source/mobile/android/app/src/main/java/com/kadr/mobile/EditorToolIconView.java
          test -f source/mobile/android/app/src/main/java/com/kadr/mobile/PreviewActionIconView.java
          test -f source/mobile/android/app/src/test/java/com/kadr/mobile/MobileUi131RegressionTest.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Android unit tests and debug compilation
        shell: bash
        working-directory: source/mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testDebugUnitTest testReleaseUnitTest assembleDebug
      - name: Restore KADR 1.0.29 signing identity
        shell: bash
        env:
          KADR_ANDROID_SIGNING_PASSWORD: ${{ secrets.KADR_ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KADR_ANDROID_SIGNING_PASSWORD"
          mkdir -p source/mobile/android/KADR/signing
          base64 -d source/mobile/android/signing/kadr-preview.keystore.b64 > source/mobile/android/KADR/signing/kadr-preview.jks
          {
            echo 'storeFile=../KADR/signing/kadr-preview.jks'
            printf 'storePassword=%s\n' "$KADR_ANDROID_SIGNING_PASSWORD"
            echo 'keyAlias=kadr'
            printf 'keyPassword=%s\n' "$KADR_ANDROID_SIGNING_PASSWORD"
          } > source/mobile/android/KADR/signing/key.properties
      - name: Compile signed 1.0.31 release APK
        shell: bash
        working-directory: source/mobile/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Verify install-over-1.0.29 signature and version
        shell: bash
        run: |
          set -euo pipefail
          apk=source/mobile/android/app/build/outputs/apk/release/app-release.apk
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$apksigner"
          test -x "$aapt"
          "$apksigner" verify "$apk"
          badge="$("$aapt" dump badging "$apk" | head -1)"
          echo "$badge"
          grep -q "name='com.kadr.mobile' versionCode='41' versionName='1.0.31'" <<< "$badge"
          curl -fLSs --retry 3 -o /tmp/kadr129.apk "https://github.com/nkuchenov-hash/kadr-public/releases/download/kadr-mobile-1.0.29/KADR-Mobile-1.0.29.apk"
          "$apksigner" verify /tmp/kadr129.apk
          new="$("$apksigner" verify --print-certs "$apk" | awk '/SHA-256 digest:/ {print $NF;exit}' | tr '[:upper:]' '[:lower:]')"
          old="$("$apksigner" verify --print-certs /tmp/kadr129.apk | awk '/SHA-256 digest:/ {print $NF;exit}' | tr '[:upper:]' '[:lower:]')"
          test -n "$new"
          test "$new" = "$old"
          mkdir -p dist
          cp "$apk" dist/KADR-Mobile-1.0.31.apk
          (cd dist && sha256sum KADR-Mobile-1.0.31.apk > SHA256SUMS.txt)
          test "$(stat -c%s dist/KADR-Mobile-1.0.31.apk)" -gt 1000000
          echo "APK_SIGNING_AND_UPGRADE_CERTIFICATE_VERIFIED"
      - name: Publish verified 1.0.31 release candidate
        shell: bash
        run: |
          set -euo pipefail
          tag=kadr-mobile-1.0.31-rc
          repo="$GITHUB_REPOSITORY"
          cat > /tmp/notes.md <<EOF
          # KADR Mobile 1.0.31 — Android Release Candidate

          Native Android 1.0.31 (versionCode 41, package com.kadr.mobile), compiled from private revision ${SOURCE_SHA}. The Android unit tests, signed build, and SHA-256 signing certificate comparison with version 1.0.29 passed in this workflow. The APK installs over the existing KADR app with the same signing identity.

          Changes: redesigned compact settings with PC connection diagnostics; hidden empty queue; improved dark theme icon contrast; enlarged bottom navigation; immersive screenshot viewer with four large colored vector-icon actions; editor with prominent Hand/Crop/Text/Eraser tools, larger Undo/Redo and full-width Save; real reversible crop selection and cropped PNG export. Retains automatic Windows transfer and PDF/PNG long screenshot functions.

          **This is a release candidate. Physical TECNO LJ8 / Android 16 acceptance testing, including Accessibility service and Windows transfer, remains necessary.**
          EOF
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$repo" --notes-file /tmp/notes.md --title "KADR Mobile 1.0.31 — Signed Release Candidate" --prerelease
            gh release upload "$tag" --repo "$repo" dist/KADR-Mobile-1.0.31.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" --repo "$repo" dist/KADR-Mobile-1.0.31.apk dist/SHA256SUMS.txt --title "KADR Mobile 1.0.31 — Signed Release Candidate" --notes-file /tmp/notes.md --prerelease
          fi
          gh release view "$tag" --repo "$repo" --json assets > /tmp/assets.json
          node -e "const a=require('/tmp/assets.json').assets; if(!a.some(x=>x.name==='KADR-Mobile-1.0.31.apk'&&x.size>1000000)) process.exit(1);"
          echo "KADR_MOBILE_131_SIGNED_RELEASE_PUBLISHED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KADR-Mobile-1.0.31-signed
          path: |
            dist/KADR-Mobile-1.0.31.apk
            dist/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 10
