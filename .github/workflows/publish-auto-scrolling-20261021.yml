name: Publish verified automatic scrolling Windows installer

on:
  push:
    paths:
      - '.github/workflows/publish-auto-scrolling-20261021.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: kadr-windows-auto-scroll-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN_ID: '39592010132'
      EXPECTED_VERIFY_HEAD: '0506d9cce64219baa0e4b8e6832955746f6bae0d'
      BUILD_SOURCE_SHA: '83f317df08d9b9b687d7119d23a801fc4468775b'
      MERGED_MAIN_SHA: '6834dbfc509db60ffc6d5f027a4fce646b3d37ff'
    steps:
      - name: Verify completed Windows build and exact tested candidate
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$VERIFIED_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha > /tmp/kadr-verify-run.json
          node -e "const r=require('/tmp/kadr-verify-run.json'); if(r.conclusion !== 'success' || r.headSha !== process.env.EXPECTED_VERIFY_HEAD) process.exit(1)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID/jobs?per_page=10" > /tmp/kadr-verify-jobs.json
          node -e "const r=require('/tmp/kadr-verify-jobs.json'); if(!r.jobs.some(j=>j.conclusion==='success' && j.steps.some(s=>s.name==='Compile Windows release'&&s.conclusion==='success') && j.steps.some(s=>s.name==='Build installer (not published yet)'&&s.conclusion==='success'))) process.exit(1)"
      - name: Retrieve Windows installer from successful verification run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate release
          gh run download "$VERIFIED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name kadr-auto-scroll-candidate --dir candidate
          installer=$(find candidate -type f -name 'KADR-Setup.exe' -print -quit)
          test -n "$installer" && test -s "$installer"
          cp "$installer" release/KADR-Setup.exe
          test "$(stat -c%s release/KADR-Setup.exe)" -gt 10000000
          ( cd release && sha256sum KADR-Setup.exe > KADR-Setup.sha256 )
      - name: Publish the already-verified installer and bilingual notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release/release-notes.md <<EOF
          EN

          # Fix: Start response, safe scroll input and reliable screenshot saving

          Start now updates the KADR panel immediately and shows an error if the command cannot be started. The scrolling engine tries both posted and physical Windows wheel input and can reverse direction automatically when capture begins at the bottom of a chat.

          The selection hint now applies to any scrollable screen area, not only chats. Saving uses the real Save button label. If the PNG is written but History indexing fails, KADR shows the existing file path; if normal output fails, it attempts a separate atomic recovery save in the user's local KADR folder.

          Windows build, Flutter regression tests and installer packaging passed. GUI behavior in individual external apps still requires on-device acceptance.

          Build source commit: $BUILD_SOURCE_SHA
          Merged application commit: $MERGED_MAIN_SHA

          RU

          # Исправлены запуск прокрутки и сохранение длинных скриншотов

          Кнопка «Старт» сразу подтверждает нажатие или показывает ошибку запуска. КАДР пробует два способа прокрутки Windows и сам меняет направление, если захват начался у конца чата.

          Подсказка теперь предлагает выбрать прокручиваемую область экрана, а не только чат. Если сохранение не удалось, программа предлагает нажать существующую кнопку «Сохранить», а не «Готово». Если снимок записался на диск, но не появился в истории, показывается путь к нему. При отказе обычного сохранения КАДР пробует записать PNG в резервную локальную папку.

          Тесты, компиляция Windows и упаковка установщика завершились успешно. Поведение на конкретном компьютере с браузером или Телемостом нужно проверить.

          Исходный commit сборки: $BUILD_SOURCE_SHA
          Commit приложения: $MERGED_MAIN_SHA
          EOF
          gh release edit windows-latest --repo "$GITHUB_REPOSITORY" --title 'KADR Windows — scrolling Start and Save fixes' --notes-file release/release-notes.md --latest
          gh release upload windows-latest release/KADR-Setup.exe release/KADR-Setup.sha256 --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify published file and source metadata
        shell: bash
        run: |
          set -euo pipefail
          gh release view windows-latest --repo "$GITHUB_REPOSITORY" --json body,assets > /tmp/kadr-release.json
          node -e "const r=require('/tmp/kadr-release.json');const file=r.assets.find(a=>a.name==='KADR-Setup.exe');if(!r.body.includes(process.env.BUILD_SOURCE_SHA)||!r.body.includes(process.env.MERGED_MAIN_SHA)||!file||file.size<10000000)process.exit(1)"
          echo "KADR Windows installer published from verified candidate"
