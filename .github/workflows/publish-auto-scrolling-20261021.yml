name: Publish verified automatic scrolling Windows installer

on:
  push:
    paths:
      - '.github/workflows/publish-auto-scrolling-20261021.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: kadr-windows-auto-scroll-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN_ID: '39584613334'
      EXPECTED_VERIFY_HEAD: 'd1e5f186c2138cff7f2b76f2b8c741de20afebd3'
      BUILD_SOURCE_SHA: 'b860b9f00817cda8e83b35bbe49785ef66e29fea'
      MERGED_MAIN_SHA: 'bcafef22ca104dafc09b6d2c08e9a178e3cd5cb3'
    steps:
      - name: Verify completed Windows build and exact tested candidate
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$VERIFIED_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha > /tmp/kadr-verify-run.json
          node -e "const r=require('/tmp/kadr-verify-run.json'); if(r.conclusion !== 'success' || r.headSha !== process.env.EXPECTED_VERIFY_HEAD) process.exit(1)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID/jobs?per_page=10" > /tmp/kadr-verify-jobs.json
          node -e "const r=require('/tmp/kadr-verify-jobs.json'); if(!r.jobs.some(j=>j.conclusion==='success' && j.steps.some(s=>s.name==='Compile Windows release'&&s.conclusion==='success') && j.steps.some(s=>s.name==='Build installer (not published yet)'&&s.conclusion==='success'))) process.exit(1)"
      - name: Retrieve Windows installer from successful verification run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate release
          gh run download "$VERIFIED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name kadr-auto-scroll-candidate --dir candidate
          installer=$(find candidate -type f -name 'KADR-Setup.exe' -print -quit)
          test -n "$installer" && test -s "$installer"
          cp "$installer" release/KADR-Setup.exe
          test "$(stat -c%s release/KADR-Setup.exe)" -gt 10000000
          ( cd release && sha256sum KADR-Setup.exe > KADR-Setup.sha256 )
      - name: Publish the already-verified installer and bilingual notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release/release-notes.md <<EOF
          EN

          # KADR now scrolls selected pages for you — Start / Stop

          Press Alt+Shift+S and select a scrolling region of a page, long list, chat or document. Choose Up or Down and press Start. KADR scrolls by one small wheel step, waits for the page, captures the region, verifies the seam and repeats. No manual scrolling and no Add frame clicks.

          Press Stop at the desired section to stop scrolling and automatically save one long PNG to disk and KADR History. Use Open file, Folder or Close. KADR stops itself at the apparent end of scrollable content and offers Save. Unsafe seams are not silently added.

          Windows Flutter tests, Windows build and installer packaging passed; behavior in individual apps must be checked on a real Windows desktop.

          Build source commit: $BUILD_SOURCE_SHA
          Merged application commit: $MERGED_MAIN_SHA

          RU

          # КАДР теперь сам прокручивает страницы — «Старт» / «Стоп»

          Нажми Alt+Shift+S и выдели прокручиваемую область сайта, списка, чата или документа. Выбери направление вверх или вниз и нажми «Старт». КАДР сам прокручивает небольшими шагами, снимает каждый участок и проверяет совмещение перед следующей прокруткой. Не нужно ни прокручивать вручную, ни нажимать «Добавить».

          В нужном месте нажми «Стоп»: КАДР остановит прокрутку и автоматически сохранит один длинный PNG на диск и в историю. После сохранения доступны «Открыть», «Папка», «Закрыть». Когда содержимое перестаёт прокручиваться, КАДР остановится сам и предложит «Сохранить».

          Сборка Windows, тесты Flutter и создание установщика завершились успешно. Работу на конкретном компьютере с Телемостом и браузером необходимо проверить.

          Исходный commit сборки: $BUILD_SOURCE_SHA
          Commit приложения: $MERGED_MAIN_SHA
          EOF
          gh release edit windows-latest --repo "$GITHUB_REPOSITORY" --title 'KADR Windows — Start / Stop auto-scrolling capture' --notes-file release/release-notes.md --latest
          gh release upload windows-latest release/KADR-Setup.exe release/KADR-Setup.sha256 --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify published file and source metadata
        shell: bash
        run: |
          set -euo pipefail
          gh release view windows-latest --repo "$GITHUB_REPOSITORY" --json body,assets > /tmp/kadr-release.json
          node -e "const r=require('/tmp/kadr-release.json');const file=r.assets.find(a=>a.name==='KADR-Setup.exe');if(!r.body.includes(process.env.BUILD_SOURCE_SHA)||!r.body.includes(process.env.MERGED_MAIN_SHA)||!file||file.size<10000000)process.exit(1)"
          echo "KADR Windows installer published from verified candidate"
