name: Verify KADR Companion end-to-end build

on:
  push:
    paths:
      - '.github/workflows/verify-kadr-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android:
    name: Android, receiver, and relay regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out private KADR main
        uses: actions/checkout@v4
        with:
          repository: nkuchenov-hash/KADR
          ref: main
          path: source
          token: ${{ secrets.KADR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Capture source commit
        shell: bash
        run: |
          set -euo pipefail
          git -C source rev-parse HEAD | tee source-sha.txt

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify desktop receiver and pairing QR
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/mobile_relay_qr_persistence_test.dart test/mobile_screenshot_receiver_test.dart test/installer_release_source_contract_test.dart

      - name: Verify relay backend syntax and offline non-acknowledgement
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --check services/kadr-relay/server.js
          npm ci --prefix services/kadr-relay --omit=dev
          KADR_RELAY_PORT=18780 KADR_RELAY_BIND=127.0.0.1 node services/kadr-relay/server.js >/tmp/kadr-relay.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18780/health >/tmp/relay-health.json; then ready=1; break; fi
            sleep 0.3
          done
          if [ "$ready" != 1 ]; then cat /tmp/kadr-relay.log; exit 1; fi
          curl -fsS -X POST http://127.0.0.1:18780/v1/session >/tmp/relay-session.json
          sid="$(node -p "require('/tmp/relay-session.json').sessionId")"
          token="$(node -p "require('/tmp/relay-session.json').tokens.phone")"
          response="$(curl -sS -o /tmp/offline-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $token" --data-binary test-body "http://127.0.0.1:18780/v1/session/$sid/upload")"
          test "$response" = "503"
          node -e "if (require('/tmp/offline-response.json').error !== 'desktop_offline') process.exit(1)"

      - name: Android unit tests
        working-directory: source/mobile/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Restore stable signing key
        env:
          KADR_ANDROID_SIGNING_PASSWORD: ${{ secrets.KADR_ANDROID_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KADR_ANDROID_SIGNING_PASSWORD"
          mkdir -p source/mobile/android/KADR/signing
          base64 -d source/mobile/android/signing/kadr-preview.keystore.b64 > source/mobile/android/KADR/signing/kadr-preview.jks
          {
            echo 'storeFile=../KADR/signing/kadr-preview.jks'
            printf 'storePassword=%s\n' "$KADR_ANDROID_SIGNING_PASSWORD"
            echo 'keyAlias=kadr'
            printf 'keyPassword=%s\n' "$KADR_ANDROID_SIGNING_PASSWORD"
          } > source/mobile/android/KADR/signing/key.properties

      - name: Build and verify signed Android APK
        working-directory: source/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/apk/release/app-release.apk >/dev/null

      - name: Retain verified Android binary for release gate
        uses: actions/upload-artifact@v4
        with:
          name: KADR-Companion-Android-verified-build
          path: |
            source/mobile/android/app/build/outputs/apk/release/app-release.apk
            source-sha.txt
          retention-days: 1
          if-no-files-found: error

  verify-windows:
    name: Windows desktop tests and installer build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out private KADR main
        uses: actions/checkout@v4
        with:
          repository: nkuchenov-hash/KADR
          ref: main
          path: source
          token: ${{ secrets.KADR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Capture source commit
        shell: pwsh
        run: |
          git -C source rev-parse HEAD | Out-File -FilePath source-sha.txt -Encoding ascii

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze Windows source
        working-directory: source
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows mobile receiver and installer regression tests
        working-directory: source
        shell: pwsh
        run: |
          flutter test test/mobile_screenshot_receiver_test.dart test/mobile_relay_qr_persistence_test.dart test/installer_release_source_contract_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build desktop exe
        working-directory: source
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build desktop installer
        shell: pwsh
        working-directory: source
        run: |
          New-Item -ItemType Directory -Force -Path build\installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\kadr.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'build\installer\KADR-Setup.exe')) { throw 'KADR Windows installer missing' }

      - name: Retain verified Windows binary for release gate
        uses: actions/upload-artifact@v4
        with:
          name: KADR-Windows-verified-build
          path: |
            source/build/installer/KADR-Setup.exe
            source-sha.txt
          retention-days: 1
          if-no-files-found: error
