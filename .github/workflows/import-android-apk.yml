name: Import current KADR Android APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-android-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download signed APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-a7a0-81f4-9155-7ad8203bd1a9/raw?se=2026-09-01T08%3A58%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=4ce180cd-2dc6-5991-b12b-9857829c1967&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-01T07%3A35%3A14Z&ske=2026-09-02T07%3A35%3A14Z&sks=b&skv=2026-02-06&sig=sAAIDk0c0V77DVdZ32944tUFbwBO86eLDqZk3ZMD%2BKg%3D' -o /tmp/KADR-Mobile-signed.zip
          rm -rf /tmp/kadr-apk
          mkdir -p /tmp/kadr-apk downloads
          unzip -o /tmp/KADR-Mobile-signed.zip -d /tmp/kadr-apk
          cp /tmp/kadr-apk/KADR-Mobile.apk downloads/KADR-Mobile.apk
          cp /tmp/kadr-apk/KADR-Mobile.sha256 downloads/KADR-Mobile.sha256
          sha256sum downloads/KADR-Mobile.apk

      - name: Commit APK to public site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/KADR-Mobile.apk downloads/KADR-Mobile.sha256
          if git diff --cached --quiet; then
            echo 'APK already current.'
            exit 0
          fi
          git commit -m 'release(android): update KADR Companion APK'
          git push origin HEAD:main
