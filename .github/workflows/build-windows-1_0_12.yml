name: Build KADR Windows — manual scroll controller hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-1_0_12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout KADR source
        uses: actions/checkout@v4
        with:
          repository: nkuchenov-hash/KADR
          # Pin to PR #58 fixed source.
          ref: f2dc5dbb3d64e8c189f42535f232c39d8c1b2965
          path: source
          token: ${{ secrets.KADR_PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows
        working-directory: source
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          $expected = 'f2dc5dbb3d64e8c189f42535f232c39d8c1b2965'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Unexpected KADR source commit: $actual" }
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/manual_scroll_capture_test.dart test/video_hotkey_contract_test.dart test/p0_native_region_capture_test.dart test/p0_region_handoff_latency_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path source\build\installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" source\installer\kadr.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item source\build\installer\KADR-Setup.exe release\KADR-Setup.exe -Force
          $digest = (Get-FileHash release\KADR-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  KADR-Setup.exe" | Set-Content release\KADR-Setup.sha256 -Encoding ascii
          git -C source rev-parse HEAD | Set-Content release\source-sha.txt -Encoding ascii

      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $sha = (Get-Content release\source-sha.txt -Raw).Trim()
          @"
          EN

          # Long screenshot buttons now appear immediately

          Fixed manual scrolling screenshots: Alt+Shift+S, draw a rectangle and release the mouse. The selection is confirmed immediately; a floating Add frame / Finish / Cancel controller appears, allowing the user to scroll the chat manually. No hidden Enter confirmation is required. Regular screenshots and video-region selection are unchanged.

          Source commit: $sha

          RU

          # Кнопки длинного скриншота появляются сразу

          Исправлен режим длинного скриншота: Alt+Shift+S, выделение области, отпускание мыши. Выделение сразу подтверждается и открывается панель «Добавить / Готово / Отмена», позволяющая самостоятельно прокручивать чат. Дополнительное нажатие Enter не требуется. Обычные скриншоты и выбор области записи видео не изменены.

          Исходный commit: $sha
          "@ | Set-Content release\notes.md -Encoding utf8
          gh release edit windows-latest --repo $env:GITHUB_REPOSITORY --title 'KADR for Windows' --notes-file release\notes.md --latest
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest release\KADR-Setup.exe release\KADR-Setup.sha256 --repo $env:GITHUB_REPOSITORY --title 'KADR for Windows' --notes-file release\notes.md --latest
          } else {
            gh release upload windows-latest release\KADR-Setup.exe release\KADR-Setup.sha256 --repo $env:GITHUB_REPOSITORY --clobber
          }