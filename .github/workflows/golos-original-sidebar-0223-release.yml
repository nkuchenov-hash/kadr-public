name: GOLOS 0.2.23 Windows - Original Sidebar
on:
  push:
    branches: [main]
    paths: [.github/workflows/golos-original-sidebar-0223-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: golos-0-2-23-original-sidebar
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: windows-2022
    timeout-minutes: 115
    steps:
      - name: Checkout public distribution website
        uses: actions/checkout@v4
      - name: Checkout private GOLOS source
        uses: actions/checkout@v4
        with:
          repository: nkuchenov-hash/KADR
          ref: ca082974000d7ca8ef313ca5528122f34a60d813
          token: ${{ secrets.KADR_PRIVATE_REPO_TOKEN }}
          path: private-ci
          persist-credentials: false
      - name: Prepare GOLOS workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'private-ci/golos-ci-src'
          $target = "$env:RUNNER_TEMP/GOLOS"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item "$source/*" $target -Recurse -Force
          Copy-Item "$source/.*" $target -Recurse -Force -ErrorAction SilentlyContinue
          $c = Get-Content "$target/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($c.version -ne '0.2.23') { throw 'Incorrect release version' }
          if ($c.app.windows[0].width -ne 1080) { throw 'Unexpected app width' }
          $styles = Get-Content "$target/src/styles/globals.css" -Raw
          if (-not $styles.Contains('--sidebar-w: 220px')) { throw 'Original sidebar missing' }
          if (-not (Select-String "$target/src/screens/shellLayout.test.ts" -Pattern '--sidebar-w: 220px' -SimpleMatch -Quiet)) { throw 'Layout regression test missing' }
          $buildFile = "$target/src-tauri/build.rs"
          $b = Get-Content $buildFile -Raw
          $a = 'let commit = git_commit_label();'
          if (-not $b.Contains($a)) { throw 'Build ID anchor not found' }
          $b = $b.Replace($a, 'let commit = std::env::var("GOLOS_SOURCE_SHA_OVERRIDE").unwrap_or_else(|_| git_commit_label());')
          [IO.File]::WriteAllText($buildFile, $b)
          'GOLOS_SOURCE_SHA_OVERRIDE=ca082974' >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/GOLOS/src-tauri
          cache-on-failure: true
      - name: Generate original GOLOS brand icons
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = "$env:RUNNER_TEMP/golos-icon-tools"
          New-Item -ItemType Directory -Force $tools | Out-Null
          & npm install --prefix $tools --no-audit --no-fund --silent sharp png-to-ico@2.1.8 *> "$env:RUNNER_TEMP/golos-icon-install.log"
          if ($LASTEXITCODE -ne 0) { throw 'Icon dependencies unavailable' }
          $source = "$env:RUNNER_TEMP/GOLOS/src/assets/golos-app-icon.svg"
          $iconDir = "$env:RUNNER_TEMP/GOLOS/src-tauri/icons"
          New-Item -ItemType Directory -Force $iconDir | Out-Null
          $js = @'
          const fs=require('fs');
          const path=require('path');
          const root=process.env.RUNNER_TEMP;
          const sharp=require(path.join(root,'golos-icon-tools/node_modules/sharp'));
          const pngToIco=require(path.join(root,'golos-icon-tools/node_modules/png-to-ico'));
          const src=fs.readFileSync(path.join(root,'GOLOS/src/assets/golos-app-icon.svg'));
          const out=path.join(root,'GOLOS/src-tauri/icons');
          (async()=> {
            const buffers=await Promise.all([16,32,48,64,128,256].map(n=>sharp(src).resize(n,n).png().toBuffer()));
            fs.writeFileSync(path.join(out,'icon.png'),buffers[buffers.length-1]);
            fs.writeFileSync(path.join(out,'icon.ico'),await pngToIco(buffers));
          })().catch(()=>process.exit(1));
          '@
          $script="$tools/generate.cjs"
          [System.IO.File]::WriteAllText($script,$js)
          node $script *> "$env:RUNNER_TEMP/golos-icon-generate.log"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$iconDir/icon.ico")) { throw 'GOLOS brand icon generation failed' }
      - name: Verify frontend and architecture tests
        shell: pwsh
        working-directory: ${{ runner.temp }}/GOLOS
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          npm run test:architecture
          if ($LASTEXITCODE -ne 0) { throw 'Architecture tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Check mobile transfer compatibility source
        shell: pwsh
        run: |
          $bridge = "$env:RUNNER_TEMP/GOLOS/src-tauri/src/mobile_bridge.rs"
          if (-not (Select-String -Path $bridge -Pattern 'consume_upload' -Quiet)) { throw 'Idempotent HTTP upload missing' }
          if (-not (Select-String -Path $bridge -Pattern 'recording_upload_status' -Quiet)) { throw 'Upload preflight missing' }
          if (-not (Select-String -Path $bridge -Pattern 'duplicate_upload_consumes_all_bytes' -Quiet)) { throw 'Duplicate upload regression test missing' }

      - name: Verify Rust on Windows
        shell: pwsh
        working-directory: ${{ runner.temp }}/GOLOS/src-tauri
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust format failed' }
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting check failed' }
          # ort-sys rc12 may receive dangling DLL symlinks from the Windows
          # archive, so its fs::copy fallback crashes with OS error 3.
          $metadata = cargo metadata --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $ort = @($metadata.packages | Where-Object { $_.name -eq 'ort-sys' -and $_.version -eq '2.0.0-rc.12' })
          if ($ort.Count -ne 1) { throw 'ORT package metadata missing' }
          $path = Join-Path (Split-Path $ort[0].manifest_path -Parent) 'build/dynamic_link.rs'
          $code = Get-Content $path -Raw
          $original = 'fs::copy(&lib_path, &out_path).unwrap();'
          $replacement = 'if lib_path.exists() { fs::create_dir_all(out_path.parent().unwrap()).unwrap(); fs::copy(&lib_path, &out_path).unwrap_or_else(|e| panic!("ORT_COPY_FAIL source={} destination={} error={e}", lib_path.display(), out_path.display())); } else { println!("cargo:warning=ORT_DLL_DANGLING_SOURCE {}", lib_path.display()); }'
          if ($code.Contains($original)) {
            [System.IO.File]::WriteAllText($path, $code.Replace($original, $replacement))
            Write-Host 'Applied scoped ort-sys rc12 workaround'
          } else {
            Write-Host 'ORT source does not have the legacy copy statement; preserving upstream implementation'
          }
          foreach ($folder in @('target/release','target/release/deps','target/release/examples')) {
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
          }
          Write-Host 'Applied scoped ORT rc12 clean-runner workaround'
          # Build test binaries before placing runtime DLL dependencies.
          cargo test --release --no-run
          if ($LASTEXITCODE -ne 0) { throw 'Rust test compilation failed' }
          $root = (Resolve-Path 'target/release').Path
          $dllFiles = @(Get-ChildItem (Join-Path $root 'build') -Recurse -File -Filter '*.dll' -ErrorAction SilentlyContinue)
          $dllFiles = @($dllFiles | Where-Object { $_.Name.StartsWith('transcribe') -or $_.Name.StartsWith('ggml') -or $_.Name.StartsWith('onnxruntime') -or $_.Name -eq 'DirectML.dll' })
          if (-not @($dllFiles | Where-Object { $_.Name -eq 'transcribe.dll' }).Count) { throw 'Transcribe runtime library missing after compile' }
          $exeFiles = @(Get-ChildItem $root -Recurse -File -Filter 'golos-*.exe' -ErrorAction SilentlyContinue)
          if ($exeFiles.Count -lt 1) { throw 'No compiled GOLOS test executable' }
          $dirs = @($exeFiles | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique)
          $dirs += (Join-Path $root 'deps')
          $dirs += $root
          foreach ($folder in ($dirs | Sort-Object -Unique)) {
            foreach ($dll in $dllFiles) {
              $dest = Join-Path $folder $dll.Name
              if (-not (Test-Path $dest)) { Copy-Item -LiteralPath $dll.FullName -Destination $dest -Force }
            }
          }
          Write-Host ('Prepared DLLs for test process: ' + (($dllFiles | Select-Object -ExpandProperty Name -Unique) -join ', '))
          cargo test --release
          if ($LASTEXITCODE -ne 0) { throw 'Rust regression tests failed' }
      - name: Build NSIS installer
        shell: pwsh
        working-directory: ${{ runner.temp }}/GOLOS
        run: |
          $ErrorActionPreference = 'Stop'
          npm run tauri build
          if ($LASTEXITCODE -ne 0) { throw 'Windows Tauri installer compilation failed' }
      - name: Verify clean Windows installation of redesigned GOLOS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setups = @(Get-ChildItem "$env:RUNNER_TEMP/GOLOS/src-tauri/target/release/bundle/nsis" -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one installer" }
          $process = Start-Process -FilePath $setups[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exit code $($process.ExitCode)" }
          # Tauri 'both' defaults to a machine-wide install in silent mode.
          # Existing users may choose per-user installation in interactive mode.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'GOLOS/golos.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs/GOLOS/golos.exe'),
            (Join-Path $env:ProgramFiles 'GOLOS/golos.exe'),
            (Join-Path $env:ProgramFiles 'GOLOS/bin/golos.exe')
          )
          if (${env:ProgramFiles(x86)}) {
            $candidates += Join-Path ${env:ProgramFiles(x86)} 'GOLOS/golos.exe'
          }
          $exe = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $exe) {
            $roots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)}) |
              Where-Object { $_ -and (Test-Path $_) }
            $found = @($roots | ForEach-Object {
              Get-ChildItem $_ -Directory -Filter '*GOLOS*' -ErrorAction SilentlyContinue |
                Get-ChildItem -Recurse -File -Filter 'golos.exe' -ErrorAction SilentlyContinue
            })
            if ($found.Count -eq 0) { throw 'GOLOS installed executable not found in per-user or per-machine locations' }
            $exe = $found[0].FullName
          }
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          if ($version -notmatch '^0\.2\.22(\.|$)') { throw "Wrong version $version at $exe" }
          $tcpRule = @(Get-NetFirewallRule -DisplayName 'GOLOS Notes LAN' -ErrorAction SilentlyContinue)
          $udpRule = @(Get-NetFirewallRule -DisplayName 'GOLOS Notes Discovery' -ErrorAction SilentlyContinue)
          if ($tcpRule.Count -ne 1 -or $udpRule.Count -ne 1) {
            throw "GOLOS installer did not configure firewall: tcp=$($tcpRule.Count), udp=$($udpRule.Count)"
          }
          $tcpApplication = $tcpRule | Get-NetFirewallApplicationFilter
          if ($tcpApplication.Program -notlike '*golos.exe') {
            throw "TCP firewall rule does not target GOLOS executable: $($tcpApplication.Program)"
          }
          $tcpFilter = $tcpRule | Get-NetFirewallPortFilter
          $udpFilter = $udpRule | Get-NetFirewallPortFilter
          if ($tcpFilter.Protocol -ne 'TCP' -or $tcpFilter.LocalPort -ne '8793') { throw 'GOLOS TCP port rule wrong' }
          if ($udpFilter.Protocol -ne 'UDP' -or $udpFilter.LocalPort -ne '8794') { throw 'GOLOS UDP port rule wrong' }
          $tcpAddress = $tcpRule | Get-NetFirewallAddressFilter
          $udpAddress = $udpRule | Get-NetFirewallAddressFilter
          $tcpRemote = @($tcpAddress.RemoteAddress) -join ','
          $udpRemote = @($udpAddress.RemoteAddress) -join ','
          Write-Host "GOLOS firewall TCP allowed addresses: $tcpRemote"
          Write-Host "GOLOS firewall UDP allowed addresses: $udpRemote"
          foreach ($allowed in @($tcpRemote, $udpRemote)) {
            if (-not $allowed -or $allowed.Trim() -eq 'Any' -or $allowed.Contains('0.0.0.0/0')) {
              throw "GOLOS firewall rule has unrestricted/missing remote addresses: $allowed"
            }
            # The NetSecurity PowerShell module may normalize CIDR to address
            # ranges or netmasks. Require the 10/8 range or LocalSubnet,
            # without comparing formatting literally to '10.0.0.0/8'.
            if ($allowed -notmatch '10[.]0[.]0[.]0|LocalSubnet') {
              throw "GOLOS private LAN addresses not installed: $allowed"
            }
          }
          Write-Host "GOLOS 0.2.23 installed smoke test PASS: $exe; private TCP/UDP firewall rules present"
      - name: Publish verified installer and refresh site manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setups = @(Get-ChildItem "$env:RUNNER_TEMP/GOLOS/src-tauri/target/release/bundle/nsis" -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw 'Expected exactly one installer' }
          $asset = 'GOLOS_0.2.23_x64-Original-Sidebar.exe'
          Copy-Item $setups[0].FullName $asset -Force
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $asset).Path)
          if ($bytes.Length -lt 5000000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid installer' }
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content SHA256SUMS.txt -Encoding ascii
          'GOLOS 0.2.23 restores the exact original 220px navigation and 40px logo. The independently sized, resizable Windows window remains 1080x740. All recordings, LAN pairing and inference features from 0.2.22 are preserved.' | Set-Content release-notes.md -Encoding utf8
          gh release create golos-v0.2.23-original-sidebar-rc $asset SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --title 'GOLOS 0.2.23 Windows - Original Sidebar' --notes-file release-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
          New-Item -ItemType Directory -Force downloads,golos | Out-Null
          Copy-Item $asset downloads/GOLOS-Setup.exe -Force
          "$hash  GOLOS-Setup.exe" | Set-Content downloads/GOLOS-Setup.sha256 -Encoding ascii
          $manifest = @{name=$asset;revision='ca082974';sha256=$hash;sizeBytes=$bytes.Length;publishedAt=(Get-Date).ToUniversalTime().ToString('o');channel='preview';version='0.2.23'}
          $manifest | ConvertTo-Json | Set-Content golos/release.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/GOLOS-Setup.exe downloads/GOLOS-Setup.sha256 golos/release.json
          git commit -m 'Publish verified GOLOS 0.2.23 original sidebar installer'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit site manifest' }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw 'Site rebase failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Site update failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GOLOS-0.2.23-Original-Sidebar
          path: |
            GOLOS_0.2.23_x64-Original-Sidebar.exe
            SHA256SUMS.txt
          if-no-files-found: ignore
